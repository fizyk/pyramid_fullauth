name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to be added'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-schedule

jobs:
  release:
    permissions:
      contents: read
    uses: fizyk/actions-reuse/.github/workflows/shared-release.yml@2ab3c94b032a11fca1238ef134690e589616739d # v5.7.0
    with:
      version: ${{ inputs.version }}
      dependency-manager: 'uv'
    secrets:
      app_id: ${{ secrets.RELEASE_APP_ID }}
      private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
