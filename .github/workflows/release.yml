name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to be added'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-schedule

jobs:
  release:
    permissions:
      contents: read
    uses: fizyk/actions-reuse/.github/workflows/shared-release.yml@06f5123d5a89db10f394aaa1533a5c119b34a48f # v5.10.1
    with:
      version: ${{ inputs.version }}
      dependency-manager: 'uv'
    secrets:
      app_id: ${{ secrets.RELEASE_APP_ID }}
      private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
