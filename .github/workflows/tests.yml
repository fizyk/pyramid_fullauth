name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@3768ca868776ab12e78334cc376094a7aec3d9b6 # v5.3.1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      pytest_opts: '-k "not mysql and not postgresql"'
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql:
    needs: tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@3768ca868776ab12e78334cc376094a7aec3d9b6 # v5.3.1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      pytest_opts: "-k postgresql"
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  mysql:
    needs: tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@3768ca868776ab12e78334cc376094a7aec3d9b6 # v5.3.1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      pytest_opts: "-k mysql"
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
