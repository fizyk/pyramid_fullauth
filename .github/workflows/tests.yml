name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      pytest_opts: '-k "not mysql and not postgresql"'
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  postgresql:
    needs: tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      pytest_opts: "-k postgresql"
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  mysql:
    needs: tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      pytest_opts: "-k mysql"
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
