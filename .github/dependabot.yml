version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: daily
    time: "04:12"
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "04:13"
  open-pull-requests-limit: 2
  cooldown:
    default-days: 7
  groups:
    setup-uv:
      patterns:
      - "fizyk/actions-reuse/*"
