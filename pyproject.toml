[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pyramid-fullauth"
version = "2.2.0"
description = "pyramid_fullauth provides full authentication / authorisation implementation for pyramid applications"
readme = "README.rst"
keywords = [ "authentication", "authorisation", "pyramid", "user" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Pyramid",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyramid>=2",
    "pyramid-basemodel>=0.3",
    "pyramid-localize",
    "pyramid-mako",
    # secured against CVE-2019-7164, CVE-2019-7548
    "sqlalchemy>=1.3.0",
    "velruse>=1.1.1",
]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.optional-dependencies]
docs = [ "sphinx" ]

[project.urls]
Source = "https://github.com/fizyk/pyramid_fullauth/"
"Bug Tracker" = "https://github.com/fizyk/pyramid_fullauth/issues"
Changelog = "https://github.com/fizyk/pyramid_fullauth/blob/v2.2.0/CHANGES.rst"
Documentation = "https://fizyk.dev/pyramid_fullauth/"

[dependency-groups]
dev = [
    "mock==5.2.0",
    "pyramid==2.1.0",
    "pyramid-basemodel==0.7.0",
    "pyramid-localize==1.0.8",
    "pyramid-mako==1.1.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mysql==4.0.0",
    "pytest-postgresql==8.1.0",
    "pytest-pyramid==1.1.0",
    "sphinx==8.2.3; python_version>='3.11'",
    "sqlalchemy==2.0.52",
    "towncrier==25.8.0",
    "velruse==1.1.1",
]
release = [
    "tbump==6.11.0",
]

[tool.uv.build-backend]
module-name = "pyramid_fullauth"
module-root = ""
source-include = [ "CHANGES.rst" ]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "PL",  # pylint
    "FBT", # flake8-boolean-trap
]

[tool.ruff.lint.pylint]
max-args = 6
max-returns = 7

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest]
mysql_dbname = "tests"
mysql_port = "3307"
postgresql_port = "5433"
xfail_strict = true

[tool.tbump]

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "uv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
name = "extra"
default = ""

[[tool.tbump.file]]
src = "pyramid_fullauth/__init__.py"

[[tool.tbump.file]]
src = "README.rst"

[[tool.tbump.file]]
src = "docs/source/conf.py"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/fizyk/pyramid_fullauth/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "2.2.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/fizyk/pyramid_fullauth/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true

[tool.rstcheck]
report_level = "warning"
ignore_directives = [ "automodule" ]
